# GENERATED FROM house.json — DO NOT EDIT THIS FILE.
#
# Every choice below is a line in mcp/house.json; every comment is a line in
# mcp/install/house.template.toml. Change one of those and run:
#
#   npm run config
#
# A hand edit here is reverted by the next run, and the test suite fails in
# the meantime — it compares this file to what the template renders, byte for
# byte, so the two cannot drift apart in silence.
name = "fmwax-house"
main = "worker.js"
compatibility_date = "2025-06-01"

# And the workers.dev hostname stays alive. A Custom Domain does not retire it,
# which is the only reason adding one is safe: a preset that points at an
# archive m3u on this host and the claude.ai connector registered against it
# cannot be re-pointed from here. Setting this false would kill them silently.
workers_dev = true

# And no per-deployment preview hostname. Wrangler enables them by default when
# workers.dev is on, and a preview URL runs THAT build of this Worker against
# the live KV, the live ledger and the live secrets — so every superseded
# version stays runnable by anyone holding its URL. Nothing here uses previews,
# and the keyed pages are guarded by a path segment rather than by hostname, so
# the surface bought nothing and cost a way for old code to reach real data.
preview_urls = false

# Wrangler 4.110.0 began sending npm dependency metadata — package names,
# version constraints, installed versions from package.json and node_modules —
# to Cloudflare on every deploy, for "dependency analytics and future
# vulnerability alerting". This Worker has no runtime dependencies, so the list
# would be empty either way; it is off because a new outbound flow at deploy
# time should be a decision rather than a default, and an empty list is not a
# reason to stop reading the setting.
[dependencies_instrumentation]
enabled = false

# Workers Logs: what each request did, and anything the Worker says with
# console, kept three days, free on this plan (Cloudflare's pricing page, read
# 2026-09-23). Turned on the day a play Spotify refused left no trace of why:
# the page's sentence drops Spotify's words, and there was nowhere else to look.
# The logs stay in this Cloudflare account, and a request's URL carries its
# path, so a keyed page's address is in them.
[observability]
enabled = true

# Durable store for the streaming services' refresh tokens. Spotify's PKCE
# rotates its token on refresh, so it must survive restarts — a secret alone is
# not enough.
#   npx wrangler kv namespace create TOKENS
[[kv_namespaces]]
binding = "TOKENS"
id = "00000000000000000000000000000001"

# Playlist backups, and the program articles. Deliberately NOT the namespace
# above: rollback data and public article bodies have no business sharing a
# store with a rotating refresh token, where a stray prefix delete would take
# the credentials with it.
#   npx wrangler kv namespace create PROGRAMS
[[kv_namespaces]]
binding = "PROGRAMS"
id = "00000000000000000000000000000002"

# The request claim ledger: ONE SQLite-backed Durable Object for the whole
# household, holding claims, leases and request state ONLY — records, caches,
# backups and pointers all stay in the KV namespaces above. It exists because
# the request pipe runs two agents by design (a webhook-fired run and an
# hourly sweep), and KV cannot serialize their claims; see mcp/station.js for
# the rules and tasks/done/mc00-probe.md for the measured concurrency. Bound in
# every house, including one with the pipe switched off: it costs nothing
# unused, and one shape is simpler to reason about than two.
[[durable_objects.bindings]]
name = "STATION"
class_name = "StationLedger"

# new_sqlite_classes, not new_classes: the ledger wants the SQLite storage
# API, and a class created key-value cannot be converted later.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["StationLedger"]

# The house's settings (MC-31, mcp/settings.js): one object for the
# household, beside the ledger rather than in it, so a settings read never
# waits behind a claim. Its own migration tag, added 2026-10-16.
[[durable_objects.bindings]]
name = "HOUSE"
class_name = "HouseSettings"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["HouseSettings"]

# The DJs' faces: the JPEGs in art/covers/, one per persona, read by the
# Worker through this binding to upload a DJ's cover to their playlist. A
# shape, not a choice — every house ships the same roster and the same art —
# so it lives here and never in house.json. run_worker_first keeps the files
# off the root: nothing is served by path, so a file in the directory is not
# a page.
[assets]
directory = "../art/covers"
binding = "COVERS"
run_worker_first = true

[vars]
DEFAULT_DEVICE = "Living Room"
# The speakers the buttons page's play form may name — config, not discovery,
# so a form field can never aim the account at an arbitrary device. Spotify
# Connect targets, and only Spotify: a Tidal button is started from the remote.
ROOM_DEVICES = "[\"Living Room\",\"Kitchen\"]"

# The WiiMs by name and LAN address, for the Speakers page's shortcut recipe.
# Nothing here reaches them; the phone does, from home Wi-Fi. An address can go
# stale with DHCP — the page says so — and a wrong one only fails on the phone.
WIIM_SPEAKERS = "{\"Living Room\":\"192.168.1.20\"}"

# Where a published program is readable. Set explicitly rather than derived from
# the incoming request: the tool layer never sees one, and an explicit value
# does not drift if the Worker is later reached on a custom domain. Publishing
# a program THROWS without it.
#
# Every programme URL is built at read time from this value and never stored in
# a record, so changing it re-points the links already sent as well as future
# ones. The Worker still answers on workers.dev; it just stops SAYING so.
PROGRAM_BASE_URL = "https://fmwax-house.example.workers.dev"

# The composer's kill switch. "false" keeps the request form off every DJ page
# and its POST target answering 404. A string because [vars] only carries
# strings.
REQUESTS_ENABLED = "false"

# Autofulfillment's own switch, separate from the composer's: REQUESTS_ENABLED
# collects asks, this one wakes a Claude for them. Off means submissions sit
# pending (and honest) with no ring and no cloud session spent. The
# routine at claude.ai is the other half of this switch — disabling either
# stops the pipe.
AUTOFULFILL_ENABLED = "false"

# Where the house is (MC-15): the Talk ledger's daily minutes turn over at
# this zone's midnight. An IANA name; a misspelt one is refused in words
# rather than quietly moving the day to UTC. Without it the Worker takes the
# Tidal country's capital zone, then UTC — which is why a house whose Tidal
# account is from another country says so here.
HOUSE_TZ = "America/New_York"

# Which playlist an OLD program is replayed through, so hearing one never costs
# the set currently on the button. Must not be a playlist any DJ owns; that is
# checked at call time as well.
PROGRAM_REPLAY_PLAYLIST = "replay"

# The library page lists every program, so an unguessable slug per program is no
# longer enough on its own — the index is the list of everything. This key is
# the whole of what guards /notes/<key>. Weaker than MCP_SECRET on purpose: it
# reaches reading only, and losing it exposes what has been published rather
# than the streaming account.
#
# It is NOT here and not in this repo. It was a [vars] literal until
# 2026-08-30, which put it in every commit of a tracked file — a fair trade
# while it reached nothing but reading, and not one once it also activated
# programmes and started playback on any speaker in ROOM_DEVICES.
#
# It is a Worker secret, like MCP_SECRET:
#   npx wrangler secret put PROGRAM_LIBRARY_KEY     # openssl rand -hex 12
#
# Rotating invalidates every link already sent to somebody, so it is a decision
# rather than a chore. Adding a PROGRAM_LIBRARY_KEY line back to [vars] would
# override the secret on the next deploy and put the value back in git.

# The house: which DJ sits on which preset, holding which playlist, on which
# catalog. This is the one place that says so — the DJs themselves live in
# mcp/djs.js and know nothing about buttons, so another household installs the
# same roster on its own presets by rewriting this list and nothing else.
#
#   button    the preset number on the WiiM. A label, nothing more: the Worker
#             has no LAN path to the speaker and cannot check that the preset
#             still points at this playlist. Re-point a button in the WiiM app
#             and you must fix it here too.
#   dj        a key from mcp/djs.js. A DJ left off this list is still a DJ —
#             get_dj serves the brief — but has no button and nothing here
#             writes for them.
#   playlist  the playlist that preset plays, in that service's own shapes:
#             a Spotify id (22 characters), spotify:playlist: URI or
#             open.spotify.com link for a spotify button; a Tidal playlist id
#             (a UUID), tidal:playlist: URI or tidal.com link for a tidal one.
#             The shapes are disjoint, so an id on the wrong service is a
#             config error and fails the parse.
#   catalog   "spotify" (the default) or "tidal". Both are read and written
#             by every tool and page; the one difference is starting: Play
#             goes through Spotify Connect, so a tidal button is started from
#             the remote and the pages say so. Anything else fails the
#             deploy's first request, on purpose — a misspelling must not
#             silently mean Spotify.
#   archive   `{ button = 6, archive = true }` puts a family archive on that
#             preset (it plays an m3u this Worker serves, not a playlist).
#             Leave the line out and the house has no archive button, no
#             archive page, and no archive tools in the connector.
#   label     `{ button = 7, label = "Jazz FM" }` shows a preset the household
#             saved THEMSELVES in the WiiM app — a station, an EQ, another
#             input — on the wall under that name, with no Play and no page.
#             The Worker cannot see the speaker, so the name is all it knows;
#             no DJ can be moved onto a labelled preset. Presets named neither
#             here nor by a DJ do not appear at all.
#   guest     `{ button = 1, guest = true, live = false, name = "DJ Guest",
#             playlist = "…", catalog = "spotify" }` is a GUEST preset (MC-18):
#             a slot nobody holds, one per service, whose playlist takes any
#             DJ's set on that service, one at a time, once it is live. `name`
#             is what the household saves the preset as in the WiiM app — the
#             remote shows it and the Speakers page asks for it. `live = false`
#             keeps it out of use: nothing routes a set there and nothing
#             writes to it. A new guest goes in live, since a preset is saved
#             from something playing: a set first, then the save on each
#             speaker. No `dj`, and no DJ can be moved onto it.
#
# Two DJs cannot share a preset and one DJ cannot hold two. Wrangler hands the
# list over parsed; a JSON string of the same shape is read the same way.
BUTTONS = [
  { button = 1, guest = true, live = true, name = "Requests · Spotify", playlist = "SAMPLEPLAYLIST00000001", catalog = "spotify" },
]

# Names for the playlists nothing physical points at, so a request can say
# "replay" instead of an id. The buttons are NOT here — a "button N" key is
# refused, because BUTTONS above is where a preset's playlist is said. A
# value is a Spotify or Tidal id, URI or link, and its shape says which.
# Empty is fine — ids, URIs and exact playlist names work regardless.
#
# A key beginning "was " — `"was button 1"` — is a LEGACY playlist (MC-18):
# one this house used to write to and no longer does, kept here so that its
# saved copies can still be put back for their 90 days. This map is the undo's
# membership set; a legacy alias is on it and on nothing else — every write to
# that playlist but a restore is refused. Take the line out once the copies
# have expired.
PLAYLIST_ALIASES = '{"replay": "SAMPLEPLAYLIST00000002"}'

# Secrets are NOT set here. Push them with `wrangler secret put`, and see
# docs/install/secrets.md for which a house needs and what rotating one costs:
#   MCP_SECRET              the URL path segment that guards this server
#   PROGRAM_LIBRARY_KEY     the one that guards the library and the DJ pages
#   SPOTIFY_CLIENT_ID       public by design, but kept with the rest
#   SPOTIFY_REFRESH_TOKEN   bootstrap only; KV holds the live one after first use
#   TIDAL_CLIENT_ID         the same pair for Tidal — only when a button
#   TIDAL_REFRESH_TOKEN     names catalog "tidal"
#   ARCHIVE_M3U_KEY         only with an archive button
#   REQUEST_ROUTINE_TOKEN   only with a Claude curator: its routine's API
#                           trigger token, made on the routine's page. NEVER
#                           a [vars] literal: this repo has been bitten by a
#                           secret in a tracked file.
#   AGENT_SECRET            only with the request pipe: the curating routine's
#                           key to /mcp — the six request verbs and nothing
#                           else (toollist.js AGENT_TOOLS). openssl rand -hex 32.
#   OPENAI_API_KEY          only with the Talk page: the Worker mints each
#                           voice session with it and the phone never sees it.
#   LASTFM_KEY              optional: a free Last.fm API key, the DJs'
#                           look_up_artist (lastfm.js). Unset, it is not listed.

# The Worker's schedule: the endless DJ's watch (every ten minutes).
# Rendered as an empty list when there is none, never left out: a missing
# `crons` leaves whatever was deployed before in place, and only [] takes it
# away.
[triggers]
crons = []
